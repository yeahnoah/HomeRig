manifestVersion: 1.1
# Umbrel filters community-store apps where the app id doesn't start with the
# store id. Store id is "yeahnoah" (see ../umbrel-app-store.yml), so we prefix.
id: yeahnoah-homerig
category: automation
name: HomeRig
version: "0.3.0"
tagline: Mining-rig scheduler for Antminer S21 XP on Braiins OS+
description: >-
  HomeRig is a local scheduler and live dashboard for Antminer S21 XP miners
  running Braiins OS+. It manages on/off cycles based on blackout windows
  (e.g. peak-pricing hours), controls a HomeKit fan plug through your local
  Home Assistant, and tracks per-device electricity usage with accurate
  meter-backed cost calculations.


  Features:


  - Live per-miner dashboard with hashrate, power, temps and sparklines

  - Blackout-window scheduler with repeat-annually and multiple time slots

  - Safety interlock: miners only run when the fan plug is confirmed ON

  - Startup stagger so fans spin up before miners resume

  - Per-device electricity cost ($/hr, $/day) with peak/off-peak rate handling

  - Monthly bill projection including service charge, demand charge, and energy

  - Push notifications via ntfy.sh, Discord, or Slack

  - All credentials encrypted at rest


  Designed for the Georgia Power TOU-RD residential plan but works with any
  time-of-use rate. Requires Home Assistant with the Matter integration to
  control the Eve Energy plug.
developer: noah
website: https://github.com/yeahnoah/HomeRig
dependencies: []
repo: https://github.com/yeahnoah/HomeRig
support: https://github.com/yeahnoah/HomeRig/issues
port: 3000
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  New: profitability guard. Optionally pauses miners + fans when the live BTC
  price falls below break-even (marginal energy cost ÷ BTC mined per day, via
  the Braiins Pool API) and resumes when it recovers, with hysteresis to prevent
  flapping. A manual price floor is also supported. Adds a Profitability card to
  the dashboard and a settings section. Also fixes monthly bill accuracy: miner
  and plug history are now retained for 40 days (was 7), so the monthly energy
  total and demand-peak no longer truncate after a week.
submitter: yeahnoah
submission: https://github.com/yeahnoah/HomeRig
