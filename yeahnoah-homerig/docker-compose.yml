# HomeRig — Umbrel community app deployment.
#
# Uses the pre-built image published by the repo's GitHub Actions workflow.
# Data persists in ${APP_DATA_DIR}/data which Umbrel maps to a host volume.
#
# HOMERIG_ENCRYPTION_KEY is derived from the per-app APP_SEED so it's
# deterministic across container restarts and unique to this Umbrel install.
# Set in ./exports.sh.

services:
  # Umbrel injects this service's image (getumbrel/app-proxy) and ports
  # automatically via a merged compose override at install time. We just
  # set APP_HOST/APP_PORT so the proxy knows where to forward.
  #
  # APP_HOST uses the service name "web" — Docker compose's embedded DNS
  # resolves it within the per-app network. Bitcoin/Mempool use static IPs
  # via $APP_*_IP env vars, but the DNS service-name approach works too and
  # avoids hardcoding subnets.
  app_proxy:
    environment:
      APP_HOST: web
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/yeahnoah/homerig:latest
    container_name: yeahnoah-homerig_web_1
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/homerig.db
      HOMERIG_ENCRYPTION_KEY: ${HOMERIG_ENCRYPTION_KEY}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    # The host's Home Assistant lives at host.docker.internal:8123 inside the
    # container. Settings UI lets the user paste that URL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
