# HomeRig — Umbrel community app deployment.
#
# Uses the pre-built image published by the repo's GitHub Actions workflow.
# Data persists in ${APP_DATA_DIR}/data which Umbrel maps to a host volume.
#
# HOMERIG_ENCRYPTION_KEY is derived from the per-app APP_SEED so it's
# deterministic across container restarts and unique to this Umbrel install.
# Set in ./exports.sh.

services:
  # Umbrel injects this service's image (getumbrel/app-proxy) and ports
  # automatically via a merged compose override at install time. We just
  # set APP_HOST/APP_PORT so the proxy knows where to forward.
  #
  # APP_HOST uses the FULL container_name, not the service name.
  # Reason: Umbrel runs all apps on shared Docker networks, and multiple
  # community apps may use "web" as their service name — DNS for the bare
  # name returns multiple IPs (one per app), causing the proxy to round-robin
  # to whichever container responds first (probably not ours). The container
  # name is unique across the host so DNS resolves to just our container.
  app_proxy:
    environment:
      APP_HOST: yeahnoah-homerig_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/yeahnoah/homerig:latest
    container_name: yeahnoah-homerig_web_1
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/homerig.db
      HOMERIG_ENCRYPTION_KEY: ${HOMERIG_ENCRYPTION_KEY}
      # Blackout windows are entered in WALL-CLOCK time. The evaluator uses the
      # container's local time (new Date().getHours()), so the container must run
      # in the user's timezone — otherwise windows fire offset by the UTC delta.
      TZ: America/New_York
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    # The host's Home Assistant lives at host.docker.internal:8123 inside the
    # container. Settings UI lets the user paste that URL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
