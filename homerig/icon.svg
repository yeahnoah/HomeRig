<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- HomeRig — industrial control panel aesthetic, amber on near-black -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#f5a524" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="#262626" stroke-width="2"/>

  <!-- Status LED row near top -->
  <circle cx="120" cy="108" r="9" fill="#4ade80"/>
  <circle cx="120" cy="108" r="18" fill="#4ade80" fill-opacity="0.18"/>
  <circle cx="158" cy="108" r="9" fill="#f5a524"/>
  <circle cx="158" cy="108" r="18" fill="#f5a524" fill-opacity="0.18"/>
  <circle cx="196" cy="108" r="9" fill="#262626"/>

  <!-- "HR" wordmark, large, IBM Plex Mono-ish styling -->
  <g transform="translate(256 280)" text-anchor="middle">
    <text font-family="ui-monospace, 'IBM Plex Mono', SFMono-Regular, Menlo, monospace"
          font-size="208" font-weight="600" letter-spacing="-12" fill="#f5a524">HR</text>
  </g>

  <!-- Subtle bottom rail with hashrate-style chart line -->
  <g transform="translate(96 380)" fill="none" stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round">
    <path d="M0 40 L40 28 L80 36 L120 18 L160 24 L200 12 L240 22 L280 8 L320 16"/>
  </g>
  <g transform="translate(96 380)" fill="none" stroke="#f5a524" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65">
    <path d="M0 40 L40 28 L80 36 L120 18 L160 24 L200 12 L240 22 L280 8 L320 16"/>
  </g>

  <!-- Tick marks beneath the line, evoking a control panel -->
  <g transform="translate(96 432)" fill="#3a3a3a">
    <rect x="0"   y="0" width="2" height="14"/>
    <rect x="40"  y="0" width="2" height="14"/>
    <rect x="80"  y="0" width="2" height="14"/>
    <rect x="120" y="0" width="2" height="14"/>
    <rect x="160" y="0" width="2" height="14"/>
    <rect x="200" y="0" width="2" height="14"/>
    <rect x="240" y="0" width="2" height="14"/>
    <rect x="280" y="0" width="2" height="14"/>
    <rect x="320" y="0" width="2" height="14"/>
  </g>
</svg>
